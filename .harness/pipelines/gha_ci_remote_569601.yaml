pipeline:
  name: CI
  identifier: gha_ci_remote_569601
  description: CI pipeline migrated from GitHub Actions - runs setup, validation, greeting, and summary stages
  projectIdentifier: CSETest1
  orgIdentifier: nglabs
  tags:
    ai_generated: ''
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: ank1064/github-actions-demo
        build:
          type: branch
          spec:
            branch: <+codebase.branch>
  stages:
  - stage:
      name: Setup
      identifier: setup
      description: Print environment info and set environment label
      type: CI
      spec:
        cloneCodebase: true
        platform:
          os: Linux
          arch: Amd64
        runtime:
          type: Cloud
          spec: {}
        execution:
          steps:
          - stepGroup:
              name: Print Environment
              identifier: print_env
              steps:
              - step:
                  type: Run
                  name: Print Environment Info
                  identifier: print
                  spec:
                    shell: Bash
                    command: 'echo "Repository: <+pipeline.properties.ci.codebase.repoName>"

                      echo "Branch: <+codebase.branch>"

                      echo "Commit: <+codebase.commitSha>"

                      echo "Actor: <+pipeline.triggeredBy.name>"

                      export repo_name="<+pipeline.properties.ci.codebase.repoName>"

                      export branch="<+codebase.branch>"

                      '
                    outputVariables:
                    - name: repo_name
                      type: String
                      value: repo_name
                    - name: branch
                      type: String
                      value: branch
          - step:
              type: Run
              name: Set Environment Label
              identifier: set_environment_label
              spec:
                shell: Bash
                command: 'echo "Target environment: production"

                  export environment="production"

                  '
                outputVariables:
                - name: environment
                  type: String
                  value: environment
        type: CI
      failureStrategies:
      - onFailure:
          errors:
          - AllErrors
          action:
            type: MarkAsFailure
  - parallel:
    - stage:
        name: Validate
        identifier: validate
        description: Run repository validation checks
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - stepGroup:
                name: Validate
                identifier: validate_group
                steps:
                - step:
                    type: Run
                    name: Run Validation
                    identifier: validate_step
                    spec:
                      shell: Bash
                      command: "echo \"Running validation (strict=true)...\"\n\nif [ -f README.md ]; then\n  echo \"README.md found\"\nelse\n  echo \"README.md missing\"\n  if [ \"true\" = \"true\" ]; then\n    exit 1\n  fi\nfi\n\nif [ -d .github/workflows ]; then\n  echo \"Workflows directory found\"\nelse\n  echo \"Workflows directory missing\"\n  if [ \"true\" = \"true\" ]; then\n    exit 1\n  fi\nfi\n\necho \"Validation passed!\"\nexport status=\"passed\"\n"
                      outputVariables:
                      - name: status
                        type: String
                        value: status
          type: CI
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Greet
        identifier: greet
        description: Run greeting action
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                type: Action
                name: Greet from Custom Action
                identifier: greet_action
                spec:
                  uses: ./.github/actions/greet
                  with:
                    name: <+pipeline.stages.setup.spec.execution.steps.print_env.steps.print.output.outputVariables.repo_name>
            - step:
                type: Run
                name: Show Greeting Output
                identifier: show_greeting_output
                spec:
                  shell: Bash
                  command: 'echo "<+execution.steps.greet_action.output.outputVariables.message>"

                    '
          type: CI
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
  - stage:
      name: Summary
      identifier: summary
      description: Pipeline summary - runs always regardless of previous stage status
      type: CI
      spec:
        cloneCodebase: false
        platform:
          os: Linux
          arch: Amd64
        runtime:
          type: Cloud
          spec: {}
        execution:
          steps:
          - step:
              type: Run
              name: Pipeline Summary
              identifier: pipeline_summary
              spec:
                shell: Bash
                command: 'echo "=== CI Pipeline Summary ==="

                  echo "Repository : <+pipeline.stages.setup.spec.execution.steps.print_env.steps.print.output.outputVariables.repo_name>"

                  echo "Branch     : <+pipeline.stages.setup.spec.execution.steps.print_env.steps.print.output.outputVariables.branch>"

                  echo "Environment: <+pipeline.stages.setup.spec.execution.steps.set_environment_label.output.outputVariables.environment>"

                  echo "Validation : <+pipeline.stages.validate.spec.execution.steps.validate_group.steps.validate_step.output.outputVariables.status>"

                  echo "==========================="

                  '
        type: CI
      when:
        pipelineStatus: All
      failureStrategies:
      - onFailure:
          errors:
          - AllErrors
          action:
            type: MarkAsFailure
