template:
  name: Enterprise FRAUDSTRM Gap 79550399 - gaps filled for BANKING-FRAUDSTRM
  identifier: spring_boot_helm_pipeline_filled_BANKING_FRAUDSTRM
  versionLabel: v1
  type: Pipeline
  tags:
    fixture: '10'
    source: bamboo
    stack: python-mlops
  description: Gap-filled Harness pipeline for Bamboo plan BANKING-FRAUDSTRM, source
    unit Entire pipeline; cloned from spring_boot_helm_pipeline_filled_WORKDAY_MLGATE
  spec:
    stages:
    - stage:
        name: Environment Setup
        identifier: EnvironmentSetup
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                name: Create venv and install ML stack
                identifier: create_venv_install_ml_stack
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    PYTHON_VERSION: <+pipeline.variables.pythonVersion>
                    TORCH_VERSION: <+pipeline.variables.torchVersion>
                  command: 'python${PYTHON_VERSION} -m venv .venv && . .venv/bin/activate

                    pip install torch==${TORCH_VERSION} mlflow scikit-learn pandas
                    bandit

                    nvidia-smi || echo "CPU fallback train allowed in CI"

                    '
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Features and Train
        identifier: FeaturesAndTrain
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                name: Export Training Features
                identifier: export_training_features
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    FEATURE_STORE_URI: <+pipeline.variables.featureStoreUri>
                    ARTIFACT_BUCKET: <+pipeline.variables.artifactBucket>
                  command: '. .venv/bin/activate

                    python pipelines/export_features.py --uri ${FEATURE_STORE_URI}
                    --out data/features.parquet

                    aws s3 cp data/features.parquet ${ARTIFACT_BUCKET}/features/<+pipeline.sequenceId>/

                    '
            - step:
                name: PyTorch Model Train
                identifier: pytorch_model_train
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    TRAIN_EPOCHS: <+pipeline.variables.trainEpochs>
                    TRAIN_BATCH_SIZE: <+pipeline.variables.trainBatchSize>
                    MODEL_NAME: <+pipeline.variables.modelName>
                    ARTIFACT_BUCKET: <+pipeline.variables.artifactBucket>
                  command: ". .venv/bin/activate\npython train/train.py \\\n  --epochs\
                    \ ${TRAIN_EPOCHS} \\\n  --batch-size ${TRAIN_BATCH_SIZE} \\\n\
                    \  --features data/features.parquet \\\n  --out models/${MODEL_NAME}-<+pipeline.sequenceId>.pt\n\
                    aws s3 cp models/ ${ARTIFACT_BUCKET}/checkpoints/<+pipeline.sequenceId>/\
                    \ --recursive\n"
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Evaluate
        identifier: Evaluate
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                name: Offline Eval and Fairness
                identifier: offline_eval_fairness
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    MODEL_NAME: <+pipeline.variables.modelName>
                    FAIRNESS_THRESHOLD: <+pipeline.variables.fairnessThreshold>
                  command: ". .venv/bin/activate\npython eval/offline_eval.py \\\n\
                    \  --model models/${MODEL_NAME}-<+pipeline.sequenceId>.pt \\\n\
                    \  --fairness-threshold ${FAIRNESS_THRESHOLD} \\\n  --report reports/eval.json\n\
                    FAIRNESS_SCORE=$(python -c \"import json;print(json.load(open('reports/eval.json'))['fairness'])\"\
                    )\nif [ $(echo \"${FAIRNESS_SCORE} >= ${FAIRNESS_THRESHOLD}\"\
                    \ | bc -l) -ne 1 ]; then\n  echo \"Fairness check failed: ${FAIRNESS_SCORE}\
                    \ < ${FAIRNESS_THRESHOLD}\"\n  exit 1\nfi\n"
            - step:
                name: Latency Benchmark
                identifier: latency_bench
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    MODEL_NAME: <+pipeline.variables.modelName>
                    LATENCY_P99_MS_BUDGET: <+pipeline.variables.latencyP99MsBudget>
                  command: ". .venv/bin/activate\npython eval/latency_bench.py \\\n\
                    \  --model models/${MODEL_NAME}-<+pipeline.sequenceId>.pt \\\n\
                    \  --p99-budget-ms ${LATENCY_P99_MS_BUDGET}\n"
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: STO Security Scans
        identifier: STOSecurityScans
        type: SecurityTests
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                type: Bandit
                name: Bandit Python SAST
                identifier: bandit_python_sast
                spec:
                  mode: orchestration
                  config: default
                  target:
                    type: repository
                    detection: auto
                    name: <+pipeline.variables.modelName>
                    variant: <+codebase.branch>
                  advanced:
                    log:
                      level: info
                    fail_on_severity: high
            - step:
                type: AquaTrivy
                name: Trivy Filesystem Scan
                identifier: trivy_filesystem_scan
                spec:
                  mode: orchestration
                  config: default
                  target:
                    type: repository
                    detection: auto
                    name: <+pipeline.variables.modelName>
                    variant: <+codebase.branch>
                  advanced:
                    log:
                      level: info
                    fail_on_severity: high
            - step:
                type: Sonarqube
                name: SonarQube Analysis
                identifier: sonarqube_analysis
                spec:
                  mode: orchestration
                  config: default
                  target:
                    type: repository
                    detection: auto
                    name: <+pipeline.variables.modelName>
                    variant: <+codebase.branch>
                  advanced:
                    log:
                      level: info
                  auth:
                    access_token: <+input>
                  tool:
                    project_key: <+pipeline.variables.sonarProject>
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Register and Package
        identifier: RegisterAndPackage
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                name: MLflow Register Model
                identifier: mlflow_register_model
                type: Run
                spec:
                  shell: Sh
                  envVariables:
                    MLFLOW_TRACKING_URI: <+pipeline.variables.mlflowTrackingUri>
                    MODEL_NAME: <+pipeline.variables.modelName>
                    ARTIFACT_BUCKET: <+pipeline.variables.artifactBucket>
                  command: ". .venv/bin/activate\nexport MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}\n\
                    python pipelines/register_model.py \\\n  --name ${MODEL_NAME}\
                    \ \\\n  --artifact models/${MODEL_NAME}-<+pipeline.sequenceId>.pt\
                    \ \\\n  --run-name harness-<+pipeline.sequenceId>\naws s3 cp reports/eval.json\
                    \ ${ARTIFACT_BUCKET}/eval/<+pipeline.sequenceId>/\n"
            - step:
                name: Build Runtime Container
                identifier: build_runtime_container
                type: BuildAndPushDockerRegistry
                spec:
                  connectorRef: <+input>
                  repo: <+pipeline.variables.runtimeImageRegistry>
                  tags:
                  - <+pipeline.sequenceId>
                  buildArgs:
                    MODEL_PATH: models/<+pipeline.variables.modelName>-<+pipeline.sequenceId>.pt
                  dockerfile: serving/Dockerfile
                  context: serving/
            - step:
                name: Helm Lint and Package
                identifier: helm_lint_package
                type: Run
                spec:
                  shell: Sh
                  command: 'helm lint <+pipeline.variables.helmChart>

                    helm package <+pipeline.variables.helmChart> --version <+pipeline.sequenceId>
                    -d packaged/

                    '
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Container Image Scan
        identifier: ContainerImageScan
        type: SecurityTests
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
            - step:
                type: AquaTrivy
                name: Trivy Image Scan
                identifier: trivy_image_scan
                spec:
                  mode: orchestration
                  config: default
                  target:
                    type: container
                    detection: auto
                    name: <+pipeline.variables.modelName>
                    variant: <+pipeline.sequenceId>
                  image:
                    type: docker_v2
                    name: <+pipeline.variables.runtimeImageRegistry>
                    tag: <+pipeline.sequenceId>
                    domain: <+input>
                    access_token: <+input>
                  advanced:
                    log:
                      level: info
                    fail_on_severity: critical
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: ML Champion Gate
        identifier: MLChampionGate
        type: Approval
        spec:
          execution:
            steps:
            - step:
                type: HarnessApproval
                name: ML Champion Approval
                identifier: ml_champion_approval
                spec:
                  approvalMessage: ML Gateway model <+pipeline.sequenceId> is ready
                    for Helm CD deployment. Please review and approve to proceed with
                    shadow, staging, and production deployment.
                  includePipelineExecutionHistory: true
                  isAutoRejectEnabled: false
                  approvers:
                    userGroups: <+input>
                    minimumCount: 1
                    disallowPipelineExecutor: false
                timeout: 1d
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: MarkAsFailure
    - stage:
        name: Deploy Integration
        identifier: DeployIntegration
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
            - identifier: <+input>
          execution:
            steps:
            - step:
                name: Blue Green Deployment
                identifier: K8sBlueGreenDeploy
                type: K8sBlueGreenDeploy
                timeout: 10m
                spec:
                  skipDryRun: false
            - step:
                type: ShellScript
                name: Verify Rollout
                identifier: verify_rollout_integration
                spec:
                  shell: Bash
                  executionTarget: {}
                  source:
                    type: Inline
                    spec:
                      script: 'kubectl rollout status deployment/app --namespace integration
                        --timeout=300s

                        '
                  environmentVariables: []
                  outputVariables: []
                timeout: 10m
            - step:
                type: Http
                name: Integration Smoke Test
                identifier: integration_smoke_test
                spec:
                  url: <+pipeline.variables.integrationHealthCheckUrl>
                  method: GET
                  assertion: <+httpResponseCode> == 200
                  headers: []
                timeout: 2m
            rollbackSteps:
            - step:
                name: Blue Green Rollback
                identifier: K8sRollingRollback
                type: K8sRollingRollback
                timeout: 10m
                spec: {}
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: StageRollback
    - stage:
        name: Deploy Model Validation
        identifier: DeployModelValidation
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
            - identifier: <+input>
          execution:
            steps:
            - step:
                name: Blue Green Deployment
                identifier: K8sBlueGreenDeploy
                type: K8sBlueGreenDeploy
                timeout: 10m
                spec:
                  skipDryRun: false
            - step:
                type: ShellScript
                name: Verify Rollout
                identifier: verify_rollout_model_validation
                spec:
                  shell: Bash
                  executionTarget: {}
                  source:
                    type: Inline
                    spec:
                      script: 'kubectl rollout status deployment/app --namespace model-validation
                        --timeout=300s

                        '
                  environmentVariables: []
                  outputVariables: []
                timeout: 10m
            - step:
                type: Http
                name: Model Validation Smoke Test
                identifier: model_validation_smoke_test
                spec:
                  url: <+pipeline.variables.modelValidationHealthCheckUrl>
                  method: GET
                  assertion: <+httpResponseCode> == 200
                  headers: []
                timeout: 2m
            rollbackSteps:
            - step:
                name: Blue Green Rollback
                identifier: K8sRollingRollback
                type: K8sRollingRollback
                timeout: 10m
                spec: {}
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: StageRollback
    - stage:
        name: Deploy Production Blue Green
        identifier: DeployProductionBlueGreen
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
            - identifier: <+input>
          execution:
            steps:
            - step:
                type: HarnessApproval
                name: Production Approval
                identifier: production_approval
                spec:
                  approvalMessage: Approve blue-green deployment to production. This
                    will deploy the green workload, run shadow traffic validation
                    with drift threshold <+pipeline.variables.driftThreshold>, and
                    switch the service selector to green.
                  includePipelineExecutionHistory: true
                  isAutoRejectEnabled: false
                  approvers:
                    userGroups: <+input>
                    minimumCount: 1
                    disallowPipelineExecutor: false
                timeout: 1d
            - step:
                type: K8sBlueGreenDeploy
                name: Deploy Green Workload
                identifier: deploy_green_workload
                spec:
                  skipDryRun: false
                  pruningEnabled: false
                timeout: 15m
            - step:
                type: Http
                name: Green Health Check
                identifier: green_health_check
                spec:
                  url: <+pipeline.variables.productionHealthCheckUrl>
                  method: GET
                  assertion: <+httpResponseCode> == 200
                  headers: []
                timeout: 2m
            - step:
                type: ShellScript
                name: Shadow Traffic Validation
                identifier: shadow_traffic_validation
                spec:
                  shell: Bash
                  source:
                    type: Inline
                    spec:
                      script: 'echo "Running shadow traffic validation against green
                        workload"

                        echo "Drift threshold: ${DRIFT_THRESHOLD}"

                        ./ops/shadow-traffic.sh --threshold ${DRIFT_THRESHOLD}

                        '
                  environmentVariables:
                  - name: DRIFT_THRESHOLD
                    type: String
                    value: <+pipeline.variables.driftThreshold>
                  onDelegate: true
                timeout: 15m
            - step:
                type: K8sBGSwapServices
                name: Switch Service to Green
                identifier: switch_service_to_green
                spec:
                  skipDryRun: false
                timeout: 10m
            - step:
                type: ShellScript
                name: Verify Production Rollout
                identifier: verify_production_rollout
                spec:
                  shell: Bash
                  executionTarget: {}
                  source:
                    type: Inline
                    spec:
                      script: 'kubectl rollout status deployment/app --namespace production
                        --timeout=300s

                        '
                  environmentVariables: []
                  outputVariables: []
                timeout: 10m
            - step:
                type: Http
                name: Production Smoke Test
                identifier: production_smoke_test
                spec:
                  url: <+pipeline.variables.productionHealthCheckUrl>
                  method: GET
                  assertion: <+httpResponseCode> == 200
                  headers: []
                timeout: 2m
            rollbackSteps:
            - step:
                type: K8sBGSwapServices
                name: Rollback Switch to Blue
                identifier: rollback_switch_to_blue
                spec:
                  skipDryRun: false
                timeout: 10m
        failureStrategies:
        - onFailure:
            errors:
            - AllErrors
            action:
              type: StageRollback
    variables:
    - name: modelName
      type: String
      value: <+input>
      default: fraud-stream
    - name: modelFramework
      type: String
      value: pytorch
    - name: mlflowTrackingUri
      type: String
      value: <+input>
    - name: featureStoreUri
      type: String
      value: <+input>
    - name: runtimeImageRegistry
      type: String
      value: <+input>
    - name: helmChart
      type: String
      value: <+input>
      default: ./helm/fraud-stream
    - name: trainEpochs
      type: String
      value: <+input>
      default: '3'
    - name: trainBatchSize
      type: String
      value: <+input>
      default: '64'
    - name: latencyP99MsBudget
      type: String
      value: <+input>
      default: '120'
    - name: fairnessThreshold
      type: String
      value: <+input>
      default: '0.8'
    - name: sonarProject
      type: String
      value: <+input>
    - name: artifactBucket
      type: String
      value: <+input>
    - name: pythonVersion
      type: String
      value: '3.11'
    - name: torchVersion
      type: String
      value: 2.3.0
    - name: integrationHealthCheckUrl
      type: String
      value: <+input>
    - name: modelValidationHealthCheckUrl
      type: String
      value: <+input>
    - name: productionHealthCheckUrl
      type: String
      value: <+input>
    - name: driftThreshold
      type: String
      value: <+input>
      default: '0.03'
