service:
  name: testsvc
  identifier: testsvc
  orgIdentifier: nglabs
  projectIdentifier: CSETest1
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: m12
            type: HelmChart
            spec:
              store:
                type: OciHelmChart
                spec:
                  config:
                    type: GAR
                    spec:
                      connectorRef: csgcp
                      region: us-east1
                      project: projectid
                      repositoryName: testRepo
                  basePath: /
              chartName: nginx
              subChartPath: ""
              chartVersion: <+input>
              helmVersion: V380
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
              optionalValuesYaml: false
    type: NativeHelm
